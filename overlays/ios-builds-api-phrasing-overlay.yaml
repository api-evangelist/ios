- target: $.paths['/v1/builds'].get
  update:
    x-apievangelist-phrasing:
      intent: List builds uploaded to App Store Connect
      effect: read
      questions:
      - How do I list all the builds I've uploaded to App Store Connect?
      - Can I filter my builds to only the ones that are still processing or have expired?
      - Which builds exist for a particular version number of my app?
      instructions:
      - text: List every build for app {app}.
        slots:
          app: query.filter[app]
      - text: Show builds with version {version} that are in processing state {state}.
        slots:
          version: query.filter[version]
          state: query.filter[processingState]
      - text: List builds where expired is {expired}, sorted by {sort}.
        slots:
          expired: query.filter[expired]
          sort: query.sort
      method: generated
      generated: '2026-10-01'
- target: $.paths['/v1/builds/{id}'].get
