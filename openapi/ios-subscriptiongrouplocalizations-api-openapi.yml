                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Single SubscriptionGroupLocalization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionGroupLocalizationResponse'
        '429':
          description: Rate limit exceeded error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Subscription Group Localizations
    patch:
      tags:
      - SubscriptionGroupLocalizations
      operationId: subscriptionGroupLocalizations_updateInstance
      requestBody:
        description: SubscriptionGroupLocalization representation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionGroupLocalizationUpdateRequest'
        required: true
      responses:
        '400':
          description: Parameter error(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized error(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
