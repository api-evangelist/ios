        '401':
          description: Unauthorized error(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Single PassTypeId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassTypeIdResponse'
        '429':
          description: Rate limit exceeded error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Pass Type Ids
    patch:
      tags:
      - PassTypeIds
      operationId: passTypeIds_updateInstance
      requestBody:
        description: PassTypeId representation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassTypeIdUpdateRequest'
        required: true
      responses:
        '400':
          description: Parameter error(s)
          content:
