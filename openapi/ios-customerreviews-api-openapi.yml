openapi: 3.0.1
info:
  title: App Store Connect AccessibilityDeclarations CustomerReviews API
  version: 4.3.1
  x-platforms:
    app_store_connect_api: App Store Connect API
  description: The App Store Connect API is the standards-based REST API Apple provides to automate tasks across App Store Connect, Xcode, and Certificates, Identifiers & Profiles. It covers apps, builds, TestFlight, in-app purchases, subscriptions, Game Center, Xcode Cloud, provisioning, pricing and availability, and the full reporting surface (analytics, sales and trends, financial reports, power and performance). This spec is the official OpenAPI 3.0 document published by Apple at https://developer.apple.com/app-store-connect/api/ — mirrored here unmodified except for title-cased operation summaries.
servers:
- url: https://api.appstoreconnect.apple.com/
security:
- itc-bearer-token: []
tags:
- name: CustomerReviews
paths:
  /v1/customerReviews/{id}:
    parameters:
    - name: id
      in: path
      description: the id of the requested resource
      schema:
        type: string
      style: simple
      required: true
    get:
      tags:
      - CustomerReviews
      operationId: customerReviews_getInstance
      parameters:
      - name: fields[customerReviews]
        in: query
        description: the fields to include for returned resources of type customerReviews
        schema:
          type: array
          items:
            type: string
            enum:
            - rating
            - title
            - body
            - reviewerNickname
            - createdDate
            - territory
            - response
            - reviewTerritory
        style: form
        explode: false
        required: false
      - name: fields[customerReviewResponses]
        in: query
        description: the fields to include for returned resources of type customerReviewResponses
        schema:
          type: array
          items:
            type: string
            enum:
            - responseBody
            - lastModifiedDate
            - state
            - review
        style: form
        explode: false
        required: false
      - name: fields[territories]
        in: query
        description: the fields to include for returned resources of type territories
        schema:
          type: array
          items:
            type: string
            enum:
            - currency
        style: form
        explode: false
        required: false
      - name: include
        in: query
        description: comma-separated list of relationships to include
        schema:
          type: array
          items:
            type: string
            enum:
            - response
            - reviewTerritory
        style: form
        explode: false
        required: false
      responses:
        '400':
          description: Parameter error(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized error(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Single CustomerReview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerReviewResponse'
        '429':
          description: Rate limit exceeded error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Customer Reviews
  /v1/customerReviews/{id}/relationships/response:
    parameters:
    - name: id
      in: path
      description: the id of the requested resource
      schema:
        type: string
      style: simple
      required: true
    get:
      tags:
      - CustomerReviews
      operationId: customerReviews_response_getToOneRelationship
      parameters: []
      responses:
        '400':
          description: Parameter error(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized error(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Related linkage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerReviewResponseLinkageResponse'
        '429':
          description: Rate limit exceeded error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Related Customer Reviews / Response
  /v1/customerReviews/{id}/response:
    parameters:
    - name: id
      in: path
      description: the id of the requested resource
      schema:
        type: string
      style: simple
      required: true
    get:
      tags:
      - CustomerReviews
      operationId: customerReviews_response_getToOneRelated
      parameters:
      - name: fields[customerReviewResponses]
        in: query
        description: the fields to include for returned resources of type customerReviewResponses
        schema:
          type: array
          items:
            type: string
            enum:
            - responseBody
            - lastModifiedDate
            - state
            - review
        style: form
        explode: false
      - name: fields[customerReviews]
        in: query
        description: the fields to include for returned resources of type customerReviews
        schema:
          type: array
          items:
            type: string
            enum:
            - rating
            - title
            - body
            - reviewerNickname
            - createdDate
            - territory
            - response
            - reviewTerritory
        style: form
        explode: false
      - name: include
        in: query
        description: comma-separated list of relationships to include
        schema:
          type: array
          items:
            type: string
            enum:
            - review
        style: form
        explode: false
      responses:
        '400':
          description: Parameter error(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized error(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Single CustomerReviewResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerReviewResponseV1Response'
        '429':
          description: Rate limit exceeded error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Related Customer Reviews / Response
components:
  schemas:
    DocumentLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
      required:
      - self
    RelationshipLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
        related:
          type: string
          format: uri-reference
    CustomerReviewResponseV1:
      type: object
      title: CustomerReviewResponseV1
      properties:
        type:
          type: string
          enum:
          - customerReviewResponses
        id:
          type: string
        attributes:
          type: object
          properties:
            responseBody:
              type: string
            lastModifiedDate:
              type: string
              format: date-time
            state:
              type: string
              enum:
              - PUBLISHED
              - PENDING_PUBLISH
        relationships:
          type: object
          properties:
            review:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - customerReviews
                    id:
                      type: string
                  required:
                  - id
                  - type
        links:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - type
    ResourceLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
