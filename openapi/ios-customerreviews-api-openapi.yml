    ErrorSourceParameter:
      type: object
      title: Parameter
      properties:
        parameter:
          type: string
      required:
      - parameter
    CustomerReview:
      type: object
      title: CustomerReview
      properties:
        type:
          type: string
          enum:
          - customerReviews
        id:
          type: string
        attributes:
          type: object
          properties:
            rating:
              type: integer
              maximum: 5
              minimum: 1
            title:
              type: string
            body:
              type: string
            reviewerNickname:
              type: string
            createdDate:
              type: string
              format: date-time
            territory:
              $ref: '#/components/schemas/TerritoryCode'
        relationships:
          type: object
          properties:
            response:
              type: object
              properties:
                links:
                  $ref: '#/components/schemas/RelationshipLinks'
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - customerReviewResponses
                    id:
                      type: string
                  required:
                  - id
                  - type
            reviewTerritory:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - territories
                    id:
                      type: string
                  required:
                  - id
                  - type
        links:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - type
    CustomerReviewResponse:
      type: object
      title: CustomerReviewResponse
      properties:
        data:
          $ref: '#/components/schemas/CustomerReview'
        included:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/CustomerReviewResponseV1'
            - $ref: '#/components/schemas/Territory'
            discriminator:
              propertyName: type
              mapping:
                territories: '#/components/schemas/Territory'
                customerReviewResponses: '#/components/schemas/CustomerReviewResponseV1'
        links:
          $ref: '#/components/schemas/DocumentLinks'
      required:
      - data
      - links
    ErrorLinks:
      type: object
      properties:
        about:
          type: string
          format: uri-reference
        associated:
          oneOf:
          - type: string
            format: uri-reference
          - type: object
            properties:
              href:
                type: string
                format: uri-reference
              meta:
                type: object
                properties:
                  source:
                    type: string
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              status:
                type: string
              code:
                type: string
              title:
                type: string
              detail:
                type: string
              source:
                oneOf:
                - $ref: '#/components/schemas/ErrorSourcePointer'
                - $ref: '#/components/schemas/ErrorSourceParameter'
              links:
                $ref: '#/components/schemas/ErrorLinks'
              meta:
                type: object
                additionalProperties: {}
            required:
            - code
            - detail
            - status
            - title
    ErrorSourcePointer:
      type: object
      title: JsonPointer
      properties:
        pointer:
          type: string
      required:
      - pointer
    CustomerReviewResponseV1Response:
      type: object
      title: CustomerReviewResponseV1Response
      properties:
        data:
          $ref: '#/components/schemas/CustomerReviewResponseV1'
        included:
          type: array
          items:
            $ref: '#/components/schemas/CustomerReview'
        links:
          $ref: '#/components/schemas/DocumentLinks'
      required:
      - data
      - links
    Territory:
      type: object
      title: Territory
      properties:
        type:
          type: string
          enum:
          - territories
        id:
          type: string
        attributes:
          type: object
          properties:
            currency:
              type: string
        links:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - type
    CustomerReviewResponseLinkageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
              - customerReviewResponses
            id:
              type: string
          required:
          - id
          - type
        links:
