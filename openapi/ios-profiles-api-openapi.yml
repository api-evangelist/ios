components:
  schemas:
    ProfilesResponse:
      type: object
      title: ProfilesResponse
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
        included:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/BundleId'
            - $ref: '#/components/schemas/Certificate'
            - $ref: '#/components/schemas/Device'
            discriminator:
              propertyName: type
              mapping:
                certificates: '#/components/schemas/Certificate'
                devices: '#/components/schemas/Device'
                bundleIds: '#/components/schemas/BundleId'
        links:
          $ref: '#/components/schemas/PagedDocumentLinks'
        meta:
          $ref: '#/components/schemas/PagingInformation'
      required:
      - data
      - links
    PagedDocumentLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
        first:
          type: string
          format: uri-reference
        next:
          type: string
          format: uri-reference
      required:
      - self
    ResourceLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
    Device:
      type: object
      title: Device
      properties:
        type:
          type: string
          enum:
          - devices
        id:
          type: string
        attributes:
          type: object
          properties:
            name:
              type: string
            platform:
              $ref: '#/components/schemas/BundleIdPlatform'
            udid:
              type: string
            deviceClass:
              type: string
              enum:
              - APPLE_VISION_PRO
              - APPLE_WATCH
              - IPAD
              - IPHONE
              - IPOD
              - APPLE_TV
              - MAC
            status:
              type: string
              enum:
              - ENABLED
              - DISABLED
            model:
              type: string
            addedDate:
              type: string
              format: date-time
        links:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - type
    ErrorSourceParameter:
      type: object
      title: Parameter
      properties:
        parameter:
          type: string
      required:
      - parameter
    ErrorLinks:
      type: object
      properties:
        about:
          type: string
          format: uri-reference
        associated:
          oneOf:
          - type: string
            format: uri-reference
          - type: object
            properties:
              href:
                type: string
                format: uri-reference
              meta:
                type: object
                properties:
                  source:
                    type: string
    Profile:
      type: object
      title: Profile
      properties:
        type:
          type: string
          enum:
          - profiles
        id:
          type: string
        attributes:
          type: object
          properties:
            name:
              type: string
            platform:
              $ref: '#/components/schemas/BundleIdPlatform'
            profileType:
              type: string
              enum:
              - IOS_APP_DEVELOPMENT
              - IOS_APP_STORE
              - IOS_APP_ADHOC
              - IOS_APP_INHOUSE
              - MAC_APP_DEVELOPMENT
              - MAC_APP_STORE
              - MAC_APP_DIRECT
              - TVOS_APP_DEVELOPMENT
              - TVOS_APP_STORE
              - TVOS_APP_ADHOC
              - TVOS_APP_INHOUSE
              - MAC_CATALYST_APP_DEVELOPMENT
              - MAC_CATALYST_APP_STORE
              - MAC_CATALYST_APP_DIRECT
            profileState:
              type: string
              enum:
              - ACTIVE
              - INVALID
            profileContent:
              type: string
            uuid:
              type: string
            createdDate:
              type: string
              format: date-time
            expirationDate:
              type: string
              format: date-time
        relationships:
          type: object
          properties:
            bundleId:
              type: object
              properties:
                links:
                  $ref: '#/components/schemas/RelationshipLinks'
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - bundleIds
                    id:
                      type: string
                  required:
                  - id
                  - type
            devices:
              type: object
              properties:
                links:
                  $ref: '#/components/schemas/RelationshipLinks'
                meta:
                  $ref: '#/components/schemas/PagingInformation'
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - devices
                      id:
                        type: string
                    required:
                    - id
                    - type
            certificates:
