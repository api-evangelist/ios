components:
  schemas:
    CiBuildActionTestResultsLinkagesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - ciTestResults
              id:
                type: string
            required:
            - id
            - type
        links:
          $ref: '#/components/schemas/PagedDocumentLinks'
        meta:
          $ref: '#/components/schemas/PagingInformation'
      required:
      - data
      - links
    CiManualTagStartCondition:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/CiTagPatterns'
    ImageAsset:
      type: object
      properties:
        templateUrl:
          type: string
        width:
          type: integer
        height:
          type: integer
    PagedDocumentLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
        first:
          type: string
          format: uri-reference
        next:
          type: string
          format: uri-reference
      required:
      - self
    CiTestResultsResponse:
      type: object
      title: CiTestResultsResponse
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CiTestResult'
        links:
          $ref: '#/components/schemas/PagedDocumentLinks'
        meta:
          $ref: '#/components/schemas/PagingInformation'
      required:
      - data
      - links
    CiActionType:
      type: string
      enum:
      - BUILD
      - ANALYZE
      - TEST
      - ARCHIVE
    ResourceLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
    CiTagStartCondition:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/CiTagPatterns'
        filesAndFoldersRule:
          $ref: '#/components/schemas/CiFilesAndFoldersRule'
        autoCancel:
          type: boolean
    ErrorSourceParameter:
      type: object
      title: Parameter
      properties:
        parameter:
          type: string
      required:
      - parameter
    ErrorLinks:
      type: object
      properties:
        about:
          type: string
          format: uri-reference
        associated:
          oneOf:
          - type: string
            format: uri-reference
          - type: object
            properties:
              href:
                type: string
                format: uri-reference
              meta:
                type: object
                properties:
                  source:
                    type: string
    ScmPullRequest:
      type: object
      title: ScmPullRequest
      properties:
        type:
          type: string
          enum:
          - scmPullRequests
        id:
          type: string
        attributes:
          type: object
          properties:
            title:
              type: string
            number:
              type: integer
            webUrl:
              type: string
              format: uri
            sourceRepositoryOwner:
              type: string
            sourceRepositoryName:
              type: string
            sourceBranchName:
              type: string
            destinationRepositoryOwner:
              type: string
            destinationRepositoryName:
              type: string
            destinationBranchName:
              type: string
            isClosed:
              type: boolean
            isCrossRepository:
              type: boolean
        relationships:
          type: object
          properties:
            repository:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - scmRepositories
                    id:
                      type: string
                  required:
                  - id
                  - type
        links:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - type
    CiExecutionProgress:
      type: string
      enum:
      - PENDING
      - RUNNING
      - COMPLETE
    FileLocation:
      type: object
      properties:
        path:
          type: string
        lineNumber:
          type: integer
    CiAction:
      type: object
      properties:
        name:
          type: string
        actionType:
          $ref: '#/components/schemas/CiActionType'
        destination:
          type: string
          enum:
          - ANY_IOS_DEVICE
          - ANY_IOS_SIMULATOR
          - ANY_TVOS_DEVICE
          - ANY_TVOS_SIMULATOR
          - ANY_WATCHOS_DEVICE
          - ANY_WATCHOS_SIMULATOR
          - ANY_MAC
          - ANY_MAC_CATALYST
          - ANY_VISIONOS_DEVICE
          - ANY_VISIONOS_SIMULATOR
        buildDistributionAudience:
          $ref: '#/components/schemas/BuildAudienceType'
        testConfiguration:
          type: object
          properties:
            kind:
              type: string
              enum:
              - USE_SCHEME_SETTINGS
              - SPECIFIC_TEST_PLANS
            testPlanName:
              type: string
            testDestinations:
              type: array
              items:
                $ref: '#/components/schemas/CiTestDestination'
        scheme:
          type: string
        platform:
          type: string
          enum:
          - MACOS
          - IOS
          - TVOS
          - WATCHOS
          - VISIONOS
        isRequiredToPass:
          type: boolean
    CiTestDestinationKind:
      type: string
      enum:
      - SIMULATOR
      - MAC
    DocumentLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
      required:
      - self
    CiIssueCounts:
      type: object
      properties:
        analyzerWarnings:
          type: integer
        errors:
          type: integer
        testFailures:
          type: integer
        warnings:
          type: integer
    CiArtifactsResponse:
      type: object
      title: CiArtifactsResponse
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CiArtifact'
        links:
          $ref: '#/components/schemas/PagedDocumentLinks'
        meta:
          $ref: '#/components/schemas/PagingInformation'
      required:
      - data
      - links
    CiProduct:
      type: object
      title: CiProduct
      properties:
        type:
          type: string
          enum:
          - ciProducts
        id:
          type: string
        attributes:
          type: object
          properties:
            name:
              type: string
            createdDate:
