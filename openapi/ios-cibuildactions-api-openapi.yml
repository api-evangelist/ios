              schema:
                $ref: '#/components/schemas/CiBuildRunResponse'
        '429':
          description: Rate limit exceeded error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Related Ci Build Actions / Build Run
