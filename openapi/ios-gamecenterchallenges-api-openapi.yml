                vendorIdentifier:
                  type: string
                challengeType:
                  type: string
                  enum:
                  - LEADERBOARD
                repeatable:
                  type: boolean
                  nullable: true
              required:
              - vendorIdentifier
              - challengeType
              - referenceName
            relationships:
              type: object
              properties:
                gameCenterDetail:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - gameCenterDetails
                        id:
                          type: string
                      required:
                      - id
                      - type
                gameCenterGroup:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - gameCenterGroups
                        id:
                          type: string
                      required:
                      - id
                      - type
                versions:
                  type: object
                  properties:
                    data:
