        links:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - type
    DocumentLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
      required:
      - self
    GameCenterChallengeLeaderboardV2LinkageRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
              - gameCenterLeaderboards
            id:
              type: string
          required:
          - id
          - type
      required:
      - data
    GameCenterChallengeCreateRequest:
      type: object
      title: GameCenterChallengeCreateRequest
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
              - gameCenterChallenges
            attributes:
              type: object
              properties:
                referenceName:
