        style: form
        explode: false
        required: false
      - name: fields[reviewSubmissionItems]
        in: query
        description: the fields to include for returned resources of type reviewSubmissionItems
        schema:
          type: array
          items:
            type: string
            enum:
            - state
            - appStoreVersion
            - appCustomProductPageVersion
            - appStoreVersionExperiment
            - appStoreVersionExperimentV2
            - appEvent
            - backgroundAssetVersion
            - gameCenterAchievementVersion
            - gameCenterActivityVersion
            - gameCenterChallengeVersion
            - gameCenterLeaderboardSetVersion
            - gameCenterLeaderboardVersion
        style: form
        explode: false
        required: false
      - name: fields[appStoreVersions]
        in: query
        description: the fields to include for returned resources of type appStoreVersions
        schema:
          type: array
          items:
            type: string
            enum:
            - platform
            - versionString
            - appStoreState
            - appVersionState
            - copyright
            - reviewType
            - releaseType
            - earliestReleaseDate
            - usesIdfa
            - downloadable
            - createdDate
            - app
            - appStoreVersionLocalizations
            - build
