components:
  schemas:
    ReviewSubmissionCreateRequest:
      type: object
      title: ReviewSubmissionCreateRequest
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
              - reviewSubmissions
            attributes:
              type: object
              properties:
                platform:
                  nullable: true
                  $ref: '#/components/schemas/Platform'
            relationships:
              type: object
              properties:
                app:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - apps
                        id:
                          type: string
                      required:
                      - id
                      - type
                  required:
                  - data
              required:
              - app
          required:
          - relationships
          - type
      required:
      - data
    PagedDocumentLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
        first:
          type: string
          format: uri-reference
        next:
          type: string
          format: uri-reference
      required:
      - self
    ResourceLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
    ReviewSubmissionsResponse:
      type: object
      title: ReviewSubmissionsResponse
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReviewSubmission'
        included:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/Actor'
            - $ref: '#/components/schemas/AppStoreVersion'
            - $ref: '#/components/schemas/App'
            - $ref: '#/components/schemas/ReviewSubmissionItem'
            discriminator:
              propertyName: type
              mapping:
                actors: '#/components/schemas/Actor'
