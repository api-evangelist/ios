      - ReviewSubmissions
      operationId: reviewSubmissions_getCollection
      parameters:
      - name: filter[platform]
        in: query
        description: filter by attribute 'platform'
        schema:
          type: array
          items:
            type: string
            enum:
            - IOS
            - MAC_OS
            - TV_OS
            - VISION_OS
        style: form
        explode: false
        required: false
      - name: filter[state]
        in: query
        description: filter by attribute 'state'
        schema:
          type: array
          items:
            type: string
            enum:
            - READY_FOR_REVIEW
            - WAITING_FOR_REVIEW
            - IN_REVIEW
            - UNRESOLVED_ISSUES
            - CANCELING
            - COMPLETING
            - COMPLETE
        style: form
        explode: false
        required: false
      - name: filter[app]
        in: query
        description: filter by id(s) of related 'app'
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        required: true
      - name: fields[reviewSubmissions]
        in: query
        description: the fields to include for returned resources of type reviewSubmissions
        schema:
          type: array
          items:
            type: string
            enum:
            - platform
            - submittedDate
            - state
            - app
            - items
            - appStoreVersionForReview
            - submittedByActor
            - lastUpdatedByActor
        style: form
        explode: false
        required: false
      - name: fields[apps]
        in: query
