        explode: false
        required: false
      - name: filter[appStoreVersions]
        in: query
        description: filter by id(s) of related 'appStoreVersions'
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        required: false
      - name: filter[id]
        in: query
        description: filter by id(s)
        schema:
