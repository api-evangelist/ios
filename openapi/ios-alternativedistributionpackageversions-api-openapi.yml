components:
  schemas:
    AlternativeDistributionPackageVersionVariantsLinkagesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - alternativeDistributionPackageVariants
              id:
                type: string
            required:
            - id
            - type
        links:
          $ref: '#/components/schemas/PagedDocumentLinks'
        meta:
          $ref: '#/components/schemas/PagingInformation'
      required:
      - data
      - links
    PagedDocumentLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
        first:
          type: string
          format: uri-reference
        next:
          type: string
          format: uri-reference
      required:
      - self
    ResourceLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
    AlternativeDistributionPackageDelta:
      type: object
      title: AlternativeDistributionPackageDelta
      properties:
        type:
          type: string
          enum:
          - alternativeDistributionPackageDeltas
        id:
          type: string
        attributes:
          type: object
          properties:
            url:
              type: string
              format: uri
            urlExpirationDate:
              type: string
              format: date-time
            alternativeDistributionKeyBlob:
              type: string
            fileChecksum:
              type: string
        links:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - type
    ErrorSourceParameter:
      type: object
      title: Parameter
      properties:
        parameter:
          type: string
      required:
      - parameter
    ErrorLinks:
      type: object
      properties:
        about:
          type: string
          format: uri-reference
        associated:
          oneOf:
          - type: string
            format: uri-reference
          - type: object
            properties:
              href:
                type: string
                format: uri-reference
              meta:
                type: object
                properties:
                  source:
                    type: string
    AlternativeDistributionPackageVersionDeltasLinkagesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - alternativeDistributionPackageDeltas
              id:
                type: string
            required:
            - id
            - type
        links:
          $ref: '#/components/schemas/PagedDocumentLinks'
        meta:
          $ref: '#/components/schemas/PagingInformation'
      required:
      - data
      - links
    DocumentLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
      required:
      - self
    AlternativeDistributionPackageVariantsResponse:
      type: object
      title: AlternativeDistributionPackageVariantsResponse
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AlternativeDistributionPackageVariant'
        links:
          $ref: '#/components/schemas/PagedDocumentLinks'
        meta:
          $ref: '#/components/schemas/PagingInformation'
      required:
      - data
      - links
    Checksums:
      type: object
      properties:
        file:
          type: object
          properties:
            hash:
              type: string
            algorithm:
              $ref: '#/components/schemas/ChecksumAlgorithm'
        composite:
          type: object
          properties:
            hash:
              type: string
            algorithm:
              type: string
              enum:
              - MD5
    AlternativeDistributionPackage:
      type: object
      title: AlternativeDistributionPackage
      properties:
        type:
          type: string
          enum:
          - alternativeDistributionPackages
        id:
          type: string
        attributes:
          type: object
          properties:
            sourceFileChecksum:
              $ref: '#/components/schemas/Checksums'
        relationships:
          type: object
          properties:
            versions:
              type: object
              properties:
                links:
                  $ref: '#/components/schemas/RelationshipLinks'
                meta:
                  $ref: '#/components/schemas/PagingInformation'
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - alternativeDistributionPackageVersions
                      id:
                        type: string
                    required:
                    - id
                    - type
        links:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - type
    AlternativeDistributionPackageVariant:
      type: object
      title: AlternativeDistributionPackageVariant
      properties:
        type:
          type: string
          enum:
          - alternativeDistributionPackageVariants
        id:
          type: string
        attributes:
          type: object
          properties:
            url:
              type: string
              format: uri
            urlExpirationDate:
              type: string
              format: date-time
            alternativeDistributionKeyBlob:
              type: string
            fileChecksum:
              type: string
        links:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - type
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              status:
                type: string
              code:
                type: string
              title:
                type: string
              detail:
                type: string
              source:
                oneOf:
                - $ref: '#/components/schemas/ErrorSourcePointer'
                - $ref: '#/components/schemas/ErrorSourceParameter'
              links:
                $ref: '#/components/schemas/ErrorLinks'
              meta:
                type: object
                additionalProperties: {}
            required:
            - code
            - detail
            - status
            - title
    RelationshipLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
        related:
          type: string
          format: uri-reference
    AlternativeDistributionPackageDeltasResponse:
      type: object
      title: AlternativeDistributionPackageDeltasResponse
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AlternativeDistributionPackageDelta'
        links:
          $ref: '#/components/schemas/PagedDocumentLinks'
        meta:
          $ref: '#/components/schemas/PagingInformation'
      required:
      - data
      - links
    ChecksumAlgorithm:
      type: string
      enum:
      - MD5
      - SHA_256
    AlternativeDistributionPackageVersionResponse:
      type: object
      title: AlternativeDistributionPackageVersionResponse
      properties:
        data:
          $ref: '#/components/schemas/AlternativeDistributionPackageVersion'
        included:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/AlternativeDistributionPackageDelta'
            - $ref: '#/components/schemas/AlternativeDistributionPackageVariant'
            - $ref: '#/components/schemas/AlternativeDistributionPackage'
            discriminator:
              propertyName: type
              mapping:
                alternativeDistributionPackages: '#/components/schemas/AlternativeDistributionPackage'
                alternativeDistributionPackageDeltas: '#/components/schemas/AlternativeDistributionPackageDelta'
                alternativeDistributionPackageVariants: '#/components/schemas/AlternativeDistributionPackageVariant'
        links:
          $ref: '#/components/schemas/DocumentLinks'
      required:
      - data
      - links
    ErrorSourcePointer:
      type: object
      title: JsonPointer
      properties:
        pointer:
          type: string
      required:
      - pointer
    PagingInformation:
      type: object
      properties:
        paging:
          type: object
          properties:
            total:
              type: integer
            limit:
              type: integer
            nextCursor:
              type: string
          required:
          - limit
      required:
      - paging
    AlternativeDistributionPackageVersion:
      type: object
      title: AlternativeDistributionPackageVersion
      properties:
        type:
          type: string
          enum:
          - alternativeDistributionPackageVersions
        id:
          type: string
        attributes:
          type: object
          properties:
            url:
              type: string
              format: uri
            urlExpirationDate:
              type: string
              format: date-time
            version:
              type: string
            fileChecksum:
              type: string
            state:
              type: string
              enum:
              - COMPLETED
              - REPLACED
        relationships:
          type: object
          properties:
            variants:
              type: object
              properties:
                links:
                  $ref: '#/components/schemas/RelationshipLinks'
                meta:
                  $ref: '#/components/schemas/PagingInformation'
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - alternativeDistributionPackageVariants
                      id:
                        type: string
                    required:
                    - id
                    - type
            deltas:
              type: object
              properties:
                links:
                  $ref: '#/components/schemas/RelationshipLinks'
                meta:
                  $ref: '#/components/schemas/PagingInformation'
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - alternativeDistributionPackageDeltas
                      id:
                        type: string
                    required:
                    - id
                    - type
            alternativeDistributionPackage:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - alternativeDistributionPackages
                    id:
                      type: string
                  required:
                  - id
                  - type
        links:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - type
  securitySchemes:
    itc-bearer-token:
      type: http
      scheme: bearer
      bearerFormat: JWT
