                  - boolean
                  - 'null'
                profanityOrCrudeHumor:
                  type:
                  - string
                  - 'null'
                  enum:
                  - NONE
                  - INFREQUENT_OR_MILD
                  - FREQUENT_OR_INTENSE
                  - INFREQUENT
                  - FREQUENT
                ageAssurance:
                  type:
                  - boolean
                  - 'null'
                sexualContentGraphicAndNudity:
                  type:
                  - string
                  - 'null'
                  enum:
                  - NONE
                  - INFREQUENT_OR_MILD
                  - FREQUENT_OR_INTENSE
                  - INFREQUENT
