                  - FREQUENT_OR_INTENSE
                  - INFREQUENT
                  - FREQUENT
                ageRatingOverride:
                  type:
                  - string
                  - 'null'
                  deprecated: true
                  enum:
                  - NONE
                  - NINE_PLUS
                  - THIRTEEN_PLUS
                  - SIXTEEN_PLUS
                  - SEVENTEEN_PLUS
                  - UNRATED
                ageRatingOverrideV2:
                  type:
                  - string
                  - 'null'
                  enum:
                  - NONE
                  - NINE_PLUS
                  - THIRTEEN_PLUS
                  - SIXTEEN_PLUS
                  - EIGHTEEN_PLUS
                  - UNRATED
                koreaAgeRatingOverride:
                  type:
