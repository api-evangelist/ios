                  - INFREQUENT_OR_MILD
                  - FREQUENT_OR_INTENSE
                  - INFREQUENT
                  - FREQUENT
                unrestrictedWebAccess:
                  type:
                  - boolean
                  - 'null'
                userGeneratedContent:
                  type:
                  - boolean
                  - 'null'
                violenceCartoonOrFantasy:
                  type:
