      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
              - marketplaceWebhooks
            id:
              type: string
            attributes:
              type: object
              properties:
                endpointUrl:
                  type: string
                  format: uri
                  nullable: true
                secret:
                  type: string
                  nullable: true
          required:
