components:
  schemas:
    DocumentLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
      required:
      - self
    MarketplaceWebhook:
      type: object
      title: MarketplaceWebhook
      properties:
        type:
          type: string
          enum:
          - marketplaceWebhooks
        id:
          type: string
