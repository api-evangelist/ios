openapi: 3.0.1
info:
  title: App Store Connect AccessibilityDeclarations Users API
  version: 4.3.1
  x-platforms:
    app_store_connect_api: App Store Connect API
  description: The App Store Connect API is the standards-based REST API Apple provides to automate tasks across App Store Connect, Xcode, and Certificates, Identifiers & Profiles. It covers apps, builds, TestFlight, in-app purchases, subscriptions, Game Center, Xcode Cloud, provisioning, pricing and availability, and the full reporting surface (analytics, sales and trends, financial reports, power and performance). This spec is the official OpenAPI 3.0 document published by Apple at https://developer.apple.com/app-store-connect/api/ — mirrored here unmodified except for title-cased operation summaries.
servers:
- url: https://api.appstoreconnect.apple.com/
security:
- itc-bearer-token: []
tags:
- name: Users
paths:
  /v1/users:
    get:
      tags:
      - Users
      operationId: users_getCollection
      parameters:
      - name: filter[username]
        in: query
        description: filter by attribute 'username'
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        required: false
      - name: filter[roles]
        in: query
        description: filter by attribute 'roles'
        schema:
          type: array
          items:
            type: string
            enum:
            - ADMIN
            - FINANCE
            - ACCOUNT_HOLDER
            - SALES
            - MARKETING
            - APP_MANAGER
            - DEVELOPER
            - ACCESS_TO_REPORTS
            - CUSTOMER_SUPPORT
            - CREATE_APPS
            - CLOUD_MANAGED_DEVELOPER_ID
            - CLOUD_MANAGED_APP_DISTRIBUTION
            - GENERATE_INDIVIDUAL_KEYS
        style: form
        explode: false
        required: false
      - name: filter[visibleApps]
        in: query
        description: filter by id(s) of related 'visibleApps'
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        required: false
      - name: sort
        in: query
        description: comma-separated list of sort expressions; resources will be sorted as specified
        schema:
          type: array
          items:
            type: string
            enum:
            - username
            - -username
            - lastName
            - -lastName
        style: form
        explode: false
        required: false
      - name: fields[users]
        in: query
        description: the fields to include for returned resources of type users
        schema:
          type: array
          items:
            type: string
            enum:
            - username
            - firstName
            - lastName
            - roles
            - allAppsVisible
            - provisioningAllowed
            - visibleApps
        style: form
        explode: false
        required: false
      - name: fields[apps]
        in: query
        description: the fields to include for returned resources of type apps
        schema:
          type: array
          items:
            type: string
            enum:
            - accessibilityUrl
            - name
            - bundleId
            - sku
            - primaryLocale
            - isOrEverWasMadeForKids
            - subscriptionStatusUrl
            - subscriptionStatusUrlVersion
            - subscriptionStatusUrlForSandbox
            - subscriptionStatusUrlVersionForSandbox
            - contentRightsDeclaration
            - streamlinedPurchasingEnabled
            - accessibilityDeclarations
            - appEncryptionDeclarations
            - appStoreIcon
            - ciProduct
            - betaTesters
            - betaGroups
            - appStoreVersions
            - appTags
            - preReleaseVersions
            - betaAppLocalizations
            - builds
            - betaLicenseAgreement
            - betaAppReviewDetail
            - appInfos
            - appClips
            - appPricePoints
            - endUserLicenseAgreement
            - appPriceSchedule
            - appAvailabilityV2
            - inAppPurchases
            - subscriptionGroups
            - gameCenterEnabledVersions
            - perfPowerMetrics
            - appCustomProductPages
            - inAppPurchasesV2
            - promotedPurchases
            - appEvents
            - reviewSubmissions
            - subscriptionGracePeriod
            - customerReviews
            - customerReviewSummarizations
            - gameCenterDetail
            - appStoreVersionExperimentsV2
            - alternativeDistributionKey
            - analyticsReportRequests
            - marketplaceSearchDetail
            - buildUploads
            - backgroundAssets
            - betaFeedbackScreenshotSubmissions
            - betaFeedbackCrashSubmissions
            - searchKeywords
            - webhooks
            - androidToIosAppMappingDetails
        style: form
        explode: false
        required: false
      - name: limit
        in: query
        description: maximum resources per page
        schema:
          type: integer
          maximum: 200
        style: form
      - name: include
        in: query
        description: comma-separated list of relationships to include
        schema:
          type: array
          items:
            type: string
            enum:
            - visibleApps
        style: form
        explode: false
        required: false
      - name: limit[visibleApps]
        in: query
        description: maximum number of related visibleApps returned (when they are included)
        schema:
          type: integer
          maximum: 50
        style: form
        required: false
      responses:
        '400':
          description: Parameter error(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized error(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: List of Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '429':
          description: Rate limit exceeded error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: List Users
