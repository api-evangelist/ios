  /v1/subscriptionGroups/{id}/subscriptions:
    parameters:
    - name: id
      in: path
      description: the id of the requested resource
      schema:
        type: string
      style: simple
      required: true
    get:
      tags:
      - SubscriptionGroups
      operationId: subscriptionGroups_subscriptions_getToManyRelated
      parameters:
      - name: filter[productId]
        in: query
        description: filter by attribute 'productId'
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: filter[name]
        in: query
        description: filter by attribute 'name'
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: filter[state]
        in: query
        description: filter by attribute 'state'
        schema:
          type: array
          items:
            type: string
            enum:
            - MISSING_METADATA
            - READY_TO_SUBMIT
            - WAITING_FOR_REVIEW
            - IN_REVIEW
            - DEVELOPER_ACTION_NEEDED
            - PENDING_BINARY_APPROVAL
            - APPROVED
            - DEVELOPER_REMOVED_FROM_SALE
            - REMOVED_FROM_SALE
            - REJECTED
        style: form
        explode: false
      - name: sort
        in: query
        description: comma-separated list of sort expressions; resources will be sorted as specified
        schema:
          type: array
          items:
            type: string
            enum:
            - name
            - -name
        style: form
        explode: false
      - name: fields[subscriptions]
        in: query
        description: the fields to include for returned resources of type subscriptions
        schema:
          type: array
