        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Single GameCenterChallengeLocalization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCenterChallengeLocalizationResponse'
        '429':
          description: Rate limit exceeded error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get Game Center Challenge Localizations
    patch:
      tags:
      - GameCenterChallengeLocalizations
      operationId: gameCenterChallengeLocalizations_updateInstance
      requestBody:
        description: GameCenterChallengeLocalization representation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCenterChallengeLocalizationUpdateRequest'
        required: true
      responses:
        '400':
          description: Parameter error(s)
