                        type: string
                        enum:
                        - builds
                      id:
                        type: string
                    required:
                    - id
                    - type
        links:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - type
    Platform:
      type: string
      enum:
      - IOS
      - MAC_OS
      - TV_OS
      - VISION_OS
    DeviceConnectionType:
      type: string
      enum:
      - WIFI
      - MOBILE_DATA
      - WIRE
      - UNKNOWN
      - NONE
    DocumentLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
      required:
      - self
    BetaCrashLog:
      type: object
      title: BetaCrashLog
      properties:
        type:
          type: string
          enum:
