          type: string
        attributes:
          type: object
          properties:
            logText:
              type: string
        links:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - type
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              status:
                type: string
              code:
                type: string
              title:
                type: string
              detail:
                type: string
              source:
                oneOf:
                - $ref: '#/components/schemas/ErrorSourcePointer'
                - $ref: '#/components/schemas/ErrorSourceParameter'
              links:
                $ref: '#/components/schemas/ErrorLinks'
              meta:
                type: object
                additionalProperties: {}
            required:
            - code
            - detail
            - status
            - title
    BetaTesterState:
      type: string
      enum:
      - NOT_INVITED
      - INVITED
      - ACCEPTED
      - INSTALLED
      - REVOKED
    DeviceFamily:
      type: string
      enum:
      - IPHONE
      - IPAD
      - APPLE_TV
      - APPLE_WATCH
      - MAC
      - VISION
    BetaFeedbackCrashSubmission:
      type: object
      title: BetaFeedbackCrashSubmission
      properties:
        type:
          type: string
          enum:
          - betaFeedbackCrashSubmissions
        id:
          type: string
        attributes:
          type: object
          properties:
            createdDate:
              type: string
              format: date-time
            comment:
              type: string
            email:
              type: string
            deviceModel:
              type: string
            osVersion:
              type: string
            locale:
              type: string
            timeZone:
              type: string
            architecture:
              type: string
            connectionType:
              $ref: '#/components/schemas/DeviceConnectionType'
            pairedAppleWatch:
              type: string
            appUptimeInMilliseconds:
              type: integer
              format: int64
              maximum: 9007199254740991
              minimum: 0
            diskBytesAvailable:
              type: integer
              format: int64
              maximum: 9007199254740991
              minimum: 0
            diskBytesTotal:
              type: integer
              format: int64
              maximum: 9007199254740991
              minimum: 0
            batteryPercentage:
              type: integer
            screenWidthInPoints:
              type: integer
            screenHeightInPoints:
              type: integer
            appPlatform:
              $ref: '#/components/schemas/Platform'
            devicePlatform:
              $ref: '#/components/schemas/Platform'
            deviceFamily:
              $ref: '#/components/schemas/DeviceFamily'
            buildBundleId:
