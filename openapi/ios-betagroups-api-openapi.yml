components:
  schemas:
    BetaGroupCreateRequest:
      type: object
      title: BetaGroupCreateRequest
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
              - betaGroups
            attributes:
              type: object
              properties:
                name:
                  type: string
                isInternalGroup:
                  type: boolean
                  nullable: true
                hasAccessToAllBuilds:
                  type: boolean
                  nullable: true
                publicLinkEnabled:
                  type: boolean
                  nullable: true
                publicLinkLimitEnabled:
                  type: boolean
                  nullable: true
                publicLinkLimit:
                  type: integer
                  nullable: true
                feedbackEnabled:
                  type: boolean
                  nullable: true
              required:
              - name
            relationships:
              type: object
              properties:
                app:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - apps
                        id:
                          type: string
                      required:
                      - id
                      - type
                  required:
                  - data
                builds:
                  type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - builds
                          id:
                            type: string
                        required:
                        - id
                        - type
                betaTesters:
                  type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - betaTesters
                          id:
                            type: string
                        required:
                        - id
                        - type
              required:
              - app
          required:
          - relationships
          - attributes
          - type
      required:
      - data
    ImageAsset:
      type: object
      properties:
        templateUrl:
          type: string
        width:
          type: integer
        height:
          type: integer
    PagedDocumentLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
        first:
          type: string
          format: uri-reference
        next:
          type: string
          format: uri-reference
      required:
      - self
