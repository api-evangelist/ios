                          - gameCenterChallengeVersions
                        id:
                          type: string
                      required:
                      - id
                      - type
                gameCenterLeaderboardSetVersion:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
