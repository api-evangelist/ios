              propertyName: type
              mapping:
                appScreenshotSets: '#/components/schemas/AppScreenshotSet'
                appStoreVersionExperimentTreatments: '#/components/schemas/AppStoreVersionExperimentTreatment'
                appPreviewSets: '#/components/schemas/AppPreviewSet'
