    AppStoreVersionExperimentTreatment:
      type: object
      title: AppStoreVersionExperimentTreatment
      properties:
        type:
          type: string
          enum:
          - appStoreVersionExperimentTreatments
        id:
          type: string
        attributes:
          type: object
          properties:
            name:
              type: string
            appIcon:
              $ref: '#/components/schemas/ImageAsset'
            appIconName:
              type: string
            promotedDate:
              type: string
              format: date-time
        relationships:
          type: object
          properties:
            appStoreVersionExperiment:
              type: object
