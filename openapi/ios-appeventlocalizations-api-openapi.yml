        '200':
          description: List of AppEventScreenshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppEventScreenshotsResponse'
        '429':
          description: Rate limit exceeded error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
