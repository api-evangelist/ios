                          id:
                            type: string
                        required:
                        - id
                        - type
                appStoreVersionTemplate:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - appStoreVersions
                        id:
                          type: string
                      required:
                      - id
                      - type
                customProductPageTemplate:
                  type: object
                  properties:
