      tags:
      - Builds
      operationId: builds_getCollection
      parameters:
      - name: filter[version]
        in: query
        description: filter by attribute 'version'
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        required: false
      - name: filter[expired]
        in: query
        description: filter by attribute 'expired'
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        required: false
      - name: filter[processingState]
        in: query
        description: filter by attribute 'processingState'
        schema:
          type: array
          items:
            type: string
            enum:
            - PROCESSING
            - FAILED
            - INVALID
            - VALID
        style: form
        explode: false
        required: false
      - name: filter[betaAppReviewSubmission.betaReviewState]
        in: query
        description: filter by attribute 'betaAppReviewSubmission.betaReviewState'
        schema:
          type: array
          items:
            type: string
            enum:
            - WAITING_FOR_REVIEW
            - IN_REVIEW
            - REJECTED
            - APPROVED
