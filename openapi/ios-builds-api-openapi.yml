        description: filter by id(s) of related 'betaGroups'
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        required: false
      - name: filter[appStoreVersion]
        in: query
        description: filter by id(s) of related 'appStoreVersion'
