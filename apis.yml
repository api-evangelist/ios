- aid: ios:app-store-server-notifications
  name: App Store Server Notifications
  description: >-
    App Store Server Notifications v2 is Apple's webhook surface for in-app purchase and subscription
    lifecycle events — SUBSCRIBED, DID_RENEW, EXPIRED, REFUND, GRACE_PERIOD_EXPIRED, REVOKE, CONSUMPTION_REQUEST
    and related notification types. Providers register a production URL and a sandbox URL in App Store
    Connect; payloads are signed JWS (JSON Web Signatures) wrapping the transaction and renewal-info objects.
  humanURL: https://developer.apple.com/documentation/appstoreservernotifications
  tags:
  - Webhook
  - Subscription
  - In-App Purchases
  - Event
  - JWS
  tags_raw:
  - Webhooks
  - Subscriptions
  - In-App Purchases
  - Events
  - JWS
