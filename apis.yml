- aid: ios:apns
  name: Apple Push Notification Service (APNs)
  description: >-
    The Apple Push Notification service (APNs) is the HTTP/2 + JSON push delivery surface for sending
    remote notifications, background updates, VoIP pushes, and Live Activity updates to iOS, iPadOS, watchOS,
    tvOS and macOS devices. Providers authenticate either with a token-based JWT (ES256) or with a per-app
    TLS client certificate, and POST a notification payload to /3/device/{deviceToken}. APNs is the transport
    behind every push notification on iOS.
  humanURL: >-
    https://developer.apple.com/documentation/usernotifications/sending-notification-requests-to-apns
  baseURL: https://api.push.apple.com
  tags:
  - Push Notifications
  - HTTP/2
  - Live Activities
  - VoIP
  - Background Updates
  properties:
  - type: Documentation
    url: >-
      https://developer.apple.com/documentation/usernotifications/sending-notification-requests-to-apns
  - type: APIReference
    url: >-
      https://developer.apple.com/documentation/usernotifications/setting-up-a-remote-notification-server
  - type: Sandbox
    url: https://api.sandbox.push.apple.com
  - type: Authentication
    url: >-
      https://developer.apple.com/documentation/usernotifications/establishing-a-token-based-connection-to-apns
- aid: ios:devicecheck
  name: DeviceCheck and App Attest
  description: >-
    DeviceCheck allows servers to set and query two bits of per-device state and to verify that a request
    is coming from a genuine Apple device. App Attest, exposed through the same service, lets a server
    cryptographically verify that requests are coming from an authentic, uncompromised instance of an
    app. The API is JWT-authenticated (ES256) and is used as an anti- fraud / anti-abuse signal alongside
    iOS apps.
  humanURL: https://developer.apple.com/documentation/devicecheck
  baseURL: https://api.devicecheck.apple.com
  tags:
  - Device Attestation
  - Anti-Fraud
  - App Attest
  - Security
  properties:
  - type: Documentation
    url: https://developer.apple.com/documentation/devicecheck
  - type: APIReference
    url: >-
      https://developer.apple.com/documentation/devicecheck/accessing-and-modifying-per-device-data
  - type: Sandbox
    url: https://api.development.devicecheck.apple.com
- aid: ios:sign-in-with-apple
  name: Sign in with Apple REST API
  description: >-
    Sign in with Apple is Apple's OpenID Connect-style identity provider for iOS, web, and other Apple-platform
    apps. The REST surface, hosted at appleid.apple.com, exposes /auth/token (authorization-code and refresh-
    token exchange), /auth/revoke (token revocation), /auth/keys (JWKS public keys for ID-token validation),
    and a server-to-server notification channel for account-deletion and email-relay events. Required
    for any iOS app offering third-party social login.
  humanURL: https://developer.apple.com/sign-in-with-apple/
  baseURL: https://appleid.apple.com
  tags:
  - Authentication
  - OpenID Connect
  - Identity
  - Single Sign-On
  tags_raw:
  - Authentication
  - OpenID Connect
  - OAuth 2.0
  - Identity
  - Single Sign-On
